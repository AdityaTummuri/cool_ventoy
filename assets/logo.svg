<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a9d8f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3aafa9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background (transparent) -->

  <!-- Icon: stylized circuit/USB symbol -->
  <g transform="translate(10, 15)">
    <!-- Chip body -->
    <rect x="15" y="15" width="60" height="60" rx="6" ry="6"
          fill="none" stroke="url(#accent)" stroke-width="3"/>
    <!-- Pins -->
    <line x1="30" y1="5" x2="30" y2="15" stroke="#2a9d8f" stroke-width="2"/>
    <line x1="45" y1="5" x2="45" y2="15" stroke="#2a9d8f" stroke-width="2"/>
    <line x1="60" y1="5" x2="60" y2="15" stroke="#2a9d8f" stroke-width="2"/>
    <line x1="30" y1="75" x2="30" y2="85" stroke="#2a9d8f" stroke-width="2"/>
    <line x1="45" y1="75" x2="45" y2="85" stroke="#2a9d8f" stroke-width="2"/>
    <line x1="60" y1="75" x2="60" y2="85" stroke="#2a9d8f" stroke-width="2"/>
    <line x1="5" y1="30" x2="15" y2="30" stroke="#2a9d8f" stroke-width="2"/>
    <line x1="5" y1="45" x2="15" y2="45" stroke="#2a9d8f" stroke-width="2"/>
    <line x1="5" y1="60" x2="15" y2="60" stroke="#2a9d8f" stroke-width="2"/>
    <line x1="75" y1="30" x2="85" y2="30" stroke="#2a9d8f" stroke-width="2"/>
    <line x1="75" y1="45" x2="85" y2="45" stroke="#2a9d8f" stroke-width="2"/>
    <line x1="75" y1="60" x2="85" y2="60" stroke="#2a9d8f" stroke-width="2"/>
    <!-- Inner grid dots -->
    <circle cx="30" cy="35" r="2.5" fill="#3aafa9"/>
    <circle cx="45" cy="35" r="2.5" fill="#3aafa9"/>
    <circle cx="60" cy="35" r="2.5" fill="#3aafa9"/>
    <circle cx="30" cy="50" r="2.5" fill="#3aafa9"/>
    <circle cx="45" cy="50" r="2.5" fill="#2a9d8f"/>
    <circle cx="60" cy="50" r="2.5" fill="#3aafa9"/>
    <circle cx="30" cy="65" r="2.5" fill="#3aafa9"/>
    <circle cx="45" cy="65" r="2.5" fill="#3aafa9"/>
    <circle cx="60" cy="65" r="2.5" fill="#3aafa9"/>
  </g>

  <!-- Text: MULTIBOOT TOOLKIT -->
  <text x="120" y="55" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="36" font-weight="700" fill="#e0e0e0" letter-spacing="3">
    MULTIBOOT TOOLKIT
  </text>

  <!-- Tagline -->
  <text x="120" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="400" fill="#2a9d8f" letter-spacing="4">
    BOOT • INSTALL • RECOVER • DIAGNOSE
  </text>
</svg>
